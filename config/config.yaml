# Mango Configuration — Ported from OpenClaw

agents:
  - name: orchestrator
    role: orchestrator
    llm:
      provider: ollama
      model: qwen3.5:cloud
      base_url: http://localhost:11434/v1

  - name: worker
    skills: [weather, github]
    llm:
      provider: ollama
      model: qwen3.5:cloud
      base_url: http://localhost:11434/v1

# Discord integration — requires a SEPARATE bot token
# discord:
#   token: "YOUR_MANGO_DISCORD_BOT_TOKEN"

